<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Epic Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 고정 바(브랜드·탭·쿼터) + 단일 작업 영역, 채널 상세는 오른쪽 서랍 */
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --ink:#14201B; --muted:#5D6A64; --line:#DCE2DE;
  --accent:#0E7A5F; --accent-ink:#FFFFFF; --accent-soft:#E0F0E9;
  --short:#C27F12; --bad:#B42318; --warn:#9A5B13; --hover:#EEF2EF;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --ink:#E4EBE7; --muted:#93A29B; --line:#25312C;
  --accent:#3CC49A; --accent-ink:#06261C; --accent-soft:#12352A;
  --short:#E3A645; --bad:#F07065; --warn:#E0A24A; --hover:#1B2522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --ink:#E4EBE7; --muted:#93A29B; --line:#25312C;
  --accent:#3CC49A; --accent-ink:#06261C; --accent-soft:#12352A;
  --short:#E3A645; --bad:#F07065; --warn:#E0A24A; --hover:#1B2522; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--accent)}
.brand small{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav a{padding:8px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav a:hover{background:var(--hover);color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
nav a .cnt{font:500 11px var(--f-mono);margin-left:4px;color:var(--accent)}
.quota{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap}
.quota .bar{display:inline-block;width:64px;height:5px;border-radius:3px;background:var(--line);vertical-align:middle;margin-left:6px;overflow:hidden}
.quota .bar i{display:block;height:100%;background:var(--accent)}
main{max-width:1320px;margin:0 auto;padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:38px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;min-height:38px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--surface);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;background:var(--hover);color:var(--muted);white-space:nowrap}
.tag.new{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tag.short{color:var(--short)}
/* search layout */
.searchbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:end}
@media (max-width:760px){.searchbar{grid-template-columns:1fr 1fr}.searchbar .q{grid-column:1/-1}}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.minmax{display:flex;gap:4px;align-items:center}
.minmax span{color:var(--muted)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .arr{font-size:10px;margin-left:3px;color:var(--accent)}
td.r,th.r{text-align:right}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
.ch{display:flex;align-items:center;gap:10px;min-width:220px}
.ch img{width:36px;height:36px;border-radius:50%;flex:none;background:var(--line);object-fit:cover}
.ch .t{font-weight:600;cursor:pointer;display:block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .t:hover{color:var(--accent)}
.ch .s{font-size:12px;color:var(--muted)}
.vid{display:flex;align-items:center;gap:10px;min-width:280px}
.vid img{width:88px;aspect-ratio:16/9;border-radius:5px;object-fit:cover;flex:none;background:var(--line)}
.vid a{text-decoration:none;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid a:hover{color:var(--accent)}
.star{border:0;background:transparent;cursor:pointer;font-size:18px;line-height:1;color:var(--muted);padding:4px}
.star[aria-pressed="true"]{color:var(--short)}
.sub2{font-size:11px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.good{color:var(--accent);font-weight:600}
.best{background:var(--accent-soft)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .h{font-size:11px;color:var(--muted)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:41;overflow-y:auto;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:14px;align-items:center;z-index:2}
.drawer-head img{width:56px;height:56px;border-radius:50%;flex:none;background:var(--line)}
.drawer-body{padding:20px;display:flex;flex-direction:column;gap:18px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;max-width:calc(100% - 32px);font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--bad);color:#fff}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}
.listtabs{display:flex;gap:6px;flex-wrap:wrap}
.hbar{display:grid;grid-template-columns:minmax(90px,180px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:14px;background:var(--hover);border-radius:3px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent)}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Epic<b>Scout</b><small>YT</small></div>
    <nav id="nav" aria-label="메뉴">
      <a href="#search">유튜버 찾기</a>
      <a href="#lists">후보 리스트<span class="cnt" id="cnt-lists"></span></a>
      <a href="#compare">채널 비교<span class="cnt" id="cnt-compare"></span></a>
      <a href="#monitor">모니터링<span class="cnt" id="cnt-monitor"></span></a>
      <a href="#campaign">캠페인 성과</a>
      <a href="#setup">설정</a>
    </nav>
    <div class="quota" id="quota" title="YouTube Data API 일일 할당량(태평양 시간 자정 초기화)"></div>
  </div>
</header>
<main id="main"></main>
<div id="overlay"></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* ============ 상태 ============ */
const LS_KEY = "epicscout.v1";
const DEF = {
  key: "",
  claudeKey: "",
  claudeWs: "",
  settings: { depth: 15, cpvLong: [50, 100], cpvShort: [15, 30], region: "KR", rpmLong: [1500, 4000], rpmShort: [70, 150], model: "claude-haiku-5-5" },
  lists: { base: { name: "기본 후보", ids: [] } },
  activeList: "base",
  compare: [],
  tracked: {},
  campaigns: [],
  activeCamp: null,
  quota: { day: "", used: 0 },
  ch: {}
};
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return structuredClone(DEF);
    const o = JSON.parse(raw);
    const s = Object.assign(structuredClone(DEF), o);
    s.settings = Object.assign(structuredClone(DEF.settings), o.settings||{});
    if(!s.lists || !Object.keys(s.lists).length) s.lists = structuredClone(DEF.lists);
    if(!s.lists[s.activeList]) s.activeList = Object.keys(s.lists)[0];
    return s;
  }catch(e){ return structuredClone(DEF); }
}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 250); }
function saveNow(){
  // 채널 캐시는 최근 400개까지만 보관
  const ids = Object.keys(S.ch);
  if(ids.length > 400){
    const keep = new Set([...Object.values(S.lists).flatMap(l=>l.ids), ...S.compare, ...Object.keys(S.tracked)]);
    ids.sort((a,b)=>(S.ch[a].at||0)-(S.ch[b].at||0));
    for(const id of ids){ if(Object.keys(S.ch).length<=400) break; if(!keep.has(id)) delete S.ch[id]; }
  }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ toast("브라우저 저장 공간이 부족합니다. 설정에서 캐시를 비워 주세요.", true); }
}

/* ============ 유틸 ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 864e5;
function fmtN(n){
  if(n==null || isNaN(n)) return "—";
  const a = Math.abs(n);
  if(a >= 1e8) return (n/1e8).toFixed(a>=1e9?0:1).replace(/\.0$/,"")+"억";
  if(a >= 1e4) return (n/1e4).toFixed(a>=1e5?0:1).replace(/\.0$/,"")+"만";
  return Math.round(n).toLocaleString("ko-KR");
}
const fmtFull = n => n==null||isNaN(n) ? "—" : Math.round(n).toLocaleString("ko-KR");
const fmtPct = (r, d=1) => r==null||!isFinite(r) ? "—" : (r*100).toFixed(d)+"%";
function fmtWon(n){
  if(n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,"")+"억";
  if(n >= 1e4) return Math.round(n/1e4).toLocaleString("ko-KR")+"만";
  return Math.round(n).toLocaleString("ko-KR");
}
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; }
function ago(iso){
  if(!iso) return "—";
  const h = (Date.now()-new Date(iso))/36e5;
  if(h < 1) return "방금";
  if(h < 24) return Math.floor(h)+"시간 전";
  const d = h/24;
  if(d < 31) return Math.floor(d)+"일 전";
  if(d < 365) return Math.floor(d/30)+"개월 전";
  return (d/365).toFixed(1).replace(/\.0$/,"")+"년 전";
}
function parseDur(s){
  const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s||"");
  if(!m) return 0;
  return (+m[1]||0)*86400 + (+m[2]||0)*3600 + (+m[3]||0)*60 + (+m[4]||0);
}
const fmtSec = s => s>=3600 ? `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}` : `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function median(a){ if(!a.length) return 0; const b=[...a].sort((x,y)=>x-y), m=b.length>>1; return b.length%2 ? b[m] : (b[m-1]+b[m])/2; }
const thumbV = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const uid = () => Math.random().toString(36).slice(2,9);
let toastT;
function toast(msg, err=false){
  const t = $("#toast"); t.textContent = msg; t.className = "toast"+(err?" err":""); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(()=>t.hidden=true, err?6000:2600);
}
async function pool(items, n, fn){
  let i = 0;
  await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => {
    while(i < items.length){ const k = i++; await fn(items[k], k); }
  }));
}
function download(name, text, type="text/plain"){
  const blob = new Blob([text], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function csv(rows){
  return "﻿" + rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(",")).join("\r\n");
}

/* ============ YouTube API ============ */
const API = "https://www.googleapis.com/youtube/v3/";
function quotaDay(){ return new Date().toLocaleDateString("en-CA", {timeZone:"America/Los_Angeles"}); }
function addQuota(u){
  const d = quotaDay();
  if(S.quota.day !== d) S.quota = {day:d, used:0};
  S.quota.used += u; save(); renderQuota();
}
class ApiErr extends Error{}
async function yt(path, params, cost=1){
  if(!S.key) throw new ApiErr("API 키가 없습니다. 설정에서 YouTube Data API 키를 입력해 주세요.");
  const u = new URL(API+path);
  for(const [k,v] of Object.entries(params)) if(v!==undefined && v!=="") u.searchParams.set(k, v);
  u.searchParams.set("key", S.key);
  let r;
  try{ r = await fetch(u); }
  catch(e){ throw new ApiErr("YouTube API에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요."); }
  addQuota(cost);
  const j = await r.json().catch(()=>({}));
  if(!r.ok){
    const reason = j?.error?.errors?.[0]?.reason || "";
    const msg = j?.error?.message || "";
    if(reason==="quotaExceeded" || reason==="dailyLimitExceeded") throw new ApiErr("오늘 API 할당량을 다 썼습니다. 한국시간 오후 4~5시(태평양 자정)에 초기화됩니다.");
    if(/API key not valid|keyInvalid/i.test(msg+reason)) throw new ApiErr("API 키가 올바르지 않습니다. 설정에서 키를 확인해 주세요.");
    if(reason==="accessNotConfigured" || /has not been used|disabled/i.test(msg)) throw new ApiErr("Google Cloud 콘솔에서 YouTube Data API v3를 사용 설정해 주세요.");
    if(/referer|referrer/i.test(msg)) throw new ApiErr("API 키의 웹사이트 제한 때문에 이 주소에서 호출이 막혔습니다. 키 제한에 현재 주소를 추가하거나 제한을 해제해 주세요.");
    if(reason==="playlistNotFound") return {items:[]};
    throw new ApiErr("YouTube API 오류: "+(msg||r.status));
  }
  return j;
}
const TOPIC = {
  "Lifestyle_(sociology)":"라이프스타일","Food":"음식","Video_game_culture":"게임","Action_game":"게임","Role-playing_video_game":"게임","Strategy_video_game":"게임","Action-adventure_game":"게임","Casual_game":"게임","Simulation_video_game":"게임","Sports_game":"게임","Puzzle_video_game":"게임","Racing_video_game":"게임","Music_of_Asia":"음악","Music":"음악","Pop_music":"음악","Hip_hop_music":"음악","Electronic_music":"음악","Rock_music":"음악","Classical_music":"음악","Independent_music":"음악","Rhythm_and_blues":"음악","Soul_music":"음악","Jazz":"음악","Country_music":"음악","Reggae":"음악","Christian_music":"음악",
  "Entertainment":"엔터테인먼트","Film":"영화","Television_program":"TV","Humour":"유머","Performing_arts":"공연",
  "Fashion":"패션","Physical_attractiveness":"뷰티","Health":"건강","Physical_fitness":"피트니스","Vehicle":"자동차","Technology":"테크","Tourism":"여행","Pet":"반려동물","Hobby":"취미","Knowledge":"지식","Society":"사회","Politics":"정치","Business":"비즈니스","Religion":"종교","Military":"밀리터리",

function mapChannel(it){

    subs: +st.subscriberCount||0, hidden: !!st.hiddenSubscriberCount,

async function fetchChannels(ids){
  const out = [];
  for(let i=0;i<ids.length;i+=50){
    const j = await yt("channels", {part:"snippet,statistics,contentDetails,topicDetails", id: ids.slice(i,i+50).join(","), maxResults:50}, 1);
    for(const it of j.items||[]) out.push(mapChannel(it));

/* 광고·협찬 문구 감지 (YouTube의 '유료 프로모션 포함' 표시는 API로 안 나옴 → 제목·설명 문구로 판별) */
const AD_RE = /(유료\s?광고|광고\s?포함|협찬|제작\s?지원|지원\s?받아|소정의\s?원고료|원고료를?\s?받|#광고|#ad\b|#sponsored|sponsored by|paid promotion|브랜디드|\bPPL\b|광고입니다|\(광고\)|\[광고\])/i;
const SKIP_DOM = /(^|\.)(youtube\.com|youtu\.be|google\.com|goo\.gl|naver\.me|blog\.naver\.com|twitter\.com|x\.com|tiktok\.com|facebook\.com|discord\.gg|twitch\.tv|patreon\.com|toon\.at|linktr\.ee)$/i;
function brandHints(desc){
  const out = new Set();
  for(const m of (desc||"").matchAll(/https?:\/\/([^\s/]+)(\/[^\s]*)?/gi)){
    const host = m[1].toLowerCase().replace(/^www\.|^m\./,"");
    if(/instagram\.com$/.test(host)){ const h = (m[2]||"").split("/")[1]; if(h && !/^(p|reel|reels|stories|explore)$/.test(h)) out.add("@"+h.split("?")[0]+" (IG)"); continue; }
    if(!SKIP_DOM.test(host)) out.add(host);
  }
  for(const m of (desc||"").matchAll(/(?:^|[\s(])@([A-Za-z0-9._가-힣]{2,30})/g)) out.add("@"+m[1]);
  return [...out].slice(0,6);
}
function mapVideo(v){
  const st = v.statistics||{}, sn = v.snippet||{};
  const text = (sn.title||"")+"\n"+(sn.description||"")+"\n"+(sn.tags||[]).join(" ");
  const adm = AD_RE.exec(text);
  return { id:v.id, title:sn.title||"", ch:sn.channelId||"", chTitle:sn.channelTitle||"",
    pub:sn.publishedAt, dur:parseDur(v.contentDetails?.duration),
    views:+st.viewCount||0, likes:+st.likeCount||0, comments:+st.commentCount||0,
    ad: adm ? adm[0].trim() : "", hints: adm ? brandHints(sn.description) : [],
    live: sn.liveBroadcastContent && sn.liveBroadcastContent!=="none" };
}
async function fetchVideos(ids){
  const out = [];
  for(let i=0;i<ids.length;i+=50){
    const j = await yt("videos", {part:"snippet,statistics,contentDetails", id: ids.slice(i,i+50).join(","), maxResults:50}, 1);
    for(const v of j.items||[]) out.push(mapVideo(v));

async function recentVideos(uploads, n){
  if(!uploads) return [];
  const j = await yt("playlistItems", {part:"contentDetails", playlistId: uploads, maxResults: Math.min(n,50)}, 1);
  const ids = (j.items||[]).map(x=>x.contentDetails?.videoId).filter(Boolean);
  if(!ids.length) return [];
  const vs = await fetchVideos(ids);
  return vs.filter(v=>!v.live).sort((a,b)=>new Date(b.pub)-new Date(a.pub));
}

/* ============ 지표 계산 ============ */
const SHORT_MAX = 180; // 3분 이하 = 숏폼으로 간주
function metrics(vids, subs){
  if(!vids.length) return {n:0};
  const now = Date.now();
  let el = vids.filter(v => now - new Date(v.pub) >= 3*DAY);   // 게시 3일 미만 영상은 조회수가 덜 쌓여 제외
  if(el.length < 3) el = vids;
  const views = el.map(v=>v.views);
  const longs = el.filter(v=>v.dur > SHORT_MAX), shorts = el.filter(v=>v.dur>0 && v.dur <= SHORT_MAX);
  const sumV = views.reduce((a,b)=>a+b,0);
  const sumE = el.reduce((a,v)=>a+v.likes+v.comments,0);
  const dates = vids.map(v=>+new Date(v.pub)).sort((a,b)=>b-a);
  const every = dates.length>1 ? (dates[0]-dates[dates.length-1])/DAY/(dates.length-1) : null;
  const med = median(views);
  const adEl = el.filter(v=>v.ad), plainEl = el.filter(v=>!v.ad);
  const adMed = adEl.length ? median(adEl.map(v=>v.views)) : null;
  const plainMed = plainEl.length ? median(plainEl.map(v=>v.views)) : null;
  // 최근 90일 업로드 수로 월 업로드 추정 (포맷별)
  const in90 = vids.filter(v=>now-new Date(v.pub) < 90*DAY);
  const span = in90.length ? Math.max(30, (now - Math.min(...in90.map(v=>+new Date(v.pub))))/DAY) : 90;
  const perMonth = arr => arr.length / span * 30;
  return {
    total: vids.length, adN: vids.filter(v=>v.ad).length, adMed, plainMed,
    adLift: adMed!=null && plainMed ? adMed/plainMed : null,
    longPerMonth: perMonth(in90.filter(v=>v.dur > SHORT_MAX)), shortPerMonth: perMonth(in90.filter(v=>v.dur>0 && v.dur <= SHORT_MAX)),
    n: el.length, avg: sumV/el.length, med,
    longMed: longs.length ? median(longs.map(v=>v.views)) : 0, longN: longs.length,
    shortMed: shorts.length ? median(shorts.map(v=>v.views)) : 0, shortN: shorts.length,
    eng: sumV ? sumE/sumV : null,
    rate: subs ? med/subs : null,
    every, last: vids[0]?.pub || null,
    recent7: vids.filter(v=>now-new Date(v.pub) < 7*DAY).length
  };
}
function price(c){
  const m = c?.m; if(!m || !m.n) return null;
  const S_ = S.settings;
  if(m.longMed) return {lo:m.longMed*S_.cpvLong[0], hi:m.longMed*S_.cpvLong[1], kind:"롱폼"};
  if(m.shortMed) return {lo:m.shortMed*S_.cpvShort[0], hi:m.shortMed*S_.cpvShort[1], kind:"숏폼"};
  return null;
}
const priceTxt = c => { const p = price(c); return p ? `${fmtWon(p.lo)}~${fmtWon(p.hi)}원` : "—"; };
/* 애드센스 월 수익 추정 = 포맷별 (조회수 중앙값 × 월 업로드 수) ÷ 1000 × RPM */
function revenue(c){
  const m = c?.m; if(!m || !m.n) return null;
  const st = S.settings;
  const lv = (m.longMed||0) * (m.longPerMonth||0), sv = (m.shortMed||0) * (m.shortPerMonth||0);
  if(!lv && !sv) return {lo:0, hi:0, views:0};
  return { views: lv+sv, lo: lv/1000*st.rpmLong[0] + sv/1000*st.rpmShort[0], hi: lv/1000*st.rpmLong[1] + sv/1000*st.rpmShort[1] };
}

/* 채널 기본정보 + 최근 영상 분석을 캐시와 함께 가져오기 (채널당 약 2유닛) */
const inflight = new Map();
async function enrich(ids, {depth=S.settings.depth, force=false, onStep}={}){
  const fresh = id => { const c=S.ch[id]; return c && c.m && c.ver===2 && !force && (Date.now()-c.at < DAY) && (c.depth||0) >= Math.min(depth, c.videoCount||depth); };
  const need = [...new Set(ids)].filter(id => !fresh(id));
  let done = ids.length - need.length; onStep?.(done, ids.length);
  if(!need.length) return;
  const base = await fetchChannels(need);
  const byId = Object.fromEntries(base.map(b=>[b.id,b]));
  await pool(need, 6, async id => {
    const b = byId[id];
    if(!b){ done++; onStep?.(done, ids.length); return; }
    try{
      const key = id+":"+depth;
      if(!inflight.has(key)) inflight.set(key, recentVideos(b.uploads, depth));
      const vids = await inflight.get(key); inflight.delete(key);
      const prev = S.ch[id] || {};
      S.ch[id] = {...b, vids, m: metrics(vids, b.subs), at: Date.now(), depth, ver:2, aud: prev.aud, ai: prev.ai};
    }catch(e){ inflight.delete(id+":"+depth); if(e instanceof ApiErr && /할당량|키/.test(e.message)) throw e; S.ch[id] = {...b, vids:[], m:{n:0}, at:Date.now(), depth, ver:2}; }
    done++; onStep?.(done, ids.length);
  });
  save();
}

/* 입력값(URL, @핸들, 채널ID, 영상 URL)을 채널 ID로 */
async function resolveChannel(raw){
  const s = raw.trim(); if(!s) return null;
  let m;
  if((m = /(UC[\w-]{22})/.exec(s))) return m[1];
  if((m = /@([\w.\-·가-힣]+)/.exec(s))){
    const j = await yt("channels", {part:"id", forHandle:"@"+m[1]}, 1);
    if(j.items?.[0]) return j.items[0].id;
  }
  const vid = videoId(s);
  if(vid){ const v = await fetchVideos([vid]); if(v[0]) return v[0].ch; }
  const j = await yt("search", {part:"snippet", type:"channel", q:s, maxResults:1, regionCode:S.settings.region}, 100);
  return j.items?.[0]?.id?.channelId || null;
}
function videoId(s){
  const m = /(?:v=|youtu\.be\/|shorts\/|live\/|embed\/)([\w-]{11})/.exec(s);
  if(m) return m[1];
  if(/^[\w-]{11}$/.test(s.trim())) return s.trim();
  return null;
}

function passes(c){
  const f = SV.f, m = c.m||{};
  if(f.subMin!=="" && (c.hidden || c.subs < +f.subMin)) return false;
  if(f.subMax!=="" && (c.hidden || c.subs > +f.subMax)) return false;
  if(!c.m) return true; // 분석 전에는 구독자 조건만 적용
  if(f.medMin!=="" && (m.med||0) < +f.medMin) return false;
  if(f.rateMin!=="" && (m.rate==null || m.rate*100 < +f.rateMin)) return false;
  if(f.engMin!=="" && (m.eng==null || m.eng*100 < +f.engMin)) return false;
  if(f.recent!=="0" && (!m.last || Date.now()-new Date(m.last) > +f.recent*DAY)) return false;
  if(f.format==="long" && !(m.longN > m.shortN)) return false;
  if(f.format==="short" && !(m.shortN > m.longN)) return false;
  if(f.ad==="yes" && !m.adN) return false;
  if(f.ad==="no" && m.adN) return false;
  if(f.kr && c.country!=="KR") return false;
  if(f.topics.length && !f.topics.some(t=>(c.topics||[]).includes(t))) return false;
  return true;
}
async function runSearch(){
  const q = $("#q").value.trim(); if(!q) return;
  SV.q = q; SV.pages = +$("#pages").value; SV.busy = true; SV.ids = []; SV.prog=[0,0]; render();
  try{
    let token = "", ids = [];
    for(let p=0; p<SV.pages; p++){
      const params = {part:"snippet", type:SV.mode, q, maxResults:50, regionCode:S.settings.region, relevanceLanguage:"ko", pageToken:token};
      if(SV.mode==="video") params.publishedAfter = new Date(Date.now()-180*DAY).toISOString();
      const j = await yt("search", params, 100);
      for(const it of j.items||[]) ids.push(it.id?.channelId || it.snippet?.channelId);
      token = j.nextPageToken; if(!token) break;
    }
    SV.ids = [...new Set(ids.filter(Boolean))];
    if(!SV.ids.length){ toast("검색 결과가 없습니다. 다른 키워드로 시도해 보세요."); }
    // 기본정보 먼저 표시 후 분석
    const missing = SV.ids.filter(id=>!S.ch[id]);
    if(missing.length){ const base = await fetchChannels(missing); for(const b of base) S.ch[b.id] = {...b, at:0}; }
    SV.ids = SV.ids.filter(id=>S.ch[id]);
    SV.busy = false; render();
    let last = 0;
    await enrich(SV.ids, {onStep:(d,t)=>{ SV.prog=[d,t]; if(d-last>=4 || d===t){ last=d; if(route()==="search") render(); } }});
  }catch(e){ toast(e.message, true); }
  SV.busy = false; SV.prog=[0,0]; if(route()==="search") render();
}

const CV = { busy:false, confirm:null };
function camp(){ return S.campaigns.find(c=>c.id===S.activeCamp) || S.campaigns[0]; }
function last(v){ return v.snaps[v.snaps.length-1] || {v:0,l:0,c:0}; }
function snapAt(v, t){ let s = v.snaps[0]; for(const x of v.snaps){ if(x.t <= t) s = x; else break; } return s; }
function spark(v){
  const pts = v.snaps.map(s=>s.v); if(pts.length<2) return '<span class="muted sub2">기록 1회</span>';
  const mn = Math.min(...pts), mx = Math.max(...pts), w=96, h=26;
  const xy = pts.map((p,i)=>`${(i/(pts.length-1)*(w-4)+2).toFixed(1)},${(h-3-(mx===mn?0.5:(p-mn)/(mx-mn))*(h-6)).toFixed(1)}`);
  const lp = xy[xy.length-1].split(",");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${xy.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.6"/><circle cx="${lp[0]}" cy="${lp[1]}" r="2.4" fill="var(--accent)"/></svg>`;
}

async function addCampVideos(text, campId){
  const c = S.campaigns.find(x=>x.id===campId); if(!c) return;
  const ids = [...new Set(text.split(/[\s,]+/).map(videoId).filter(Boolean))].filter(id=>!c.videos.some(v=>v.id===id));
  if(!ids.length){ toast("추가할 새 영상 URL이 없습니다."); return; }
  try{
    const vs = await fetchVideos(ids);
    const t = Date.now();
    for(const v of vs) c.videos.push({id:v.id, title:v.title, ch:v.ch, chTitle:v.chTitle, pub:v.pub, dur:v.dur, snaps:[{t, v:v.views, l:v.likes, c:v.comments}]});
    save(); toast(`${vs.length}개 영상을 추가했습니다.`+(vs.length<ids.length?` (${ids.length-vs.length}개는 찾지 못함)`:""));
  }catch(e){ toast(e.message, true); }
  render();
}
async function snapCampaign(){
  const c = camp(); if(!c) return;
  CV.busy = true; render();
  try{
    const vs = await fetchVideos(c.videos.map(v=>v.id));
    const t = Date.now();
    for(const v of vs){
      const x = c.videos.find(y=>y.id===v.id); if(!x) continue;
      const s = {t, v:v.views, l:v.likes, c:v.comments};
      const lst = x.snaps[x.snaps.length-1];
      if(lst && t - lst.t < 10*60e3) x.snaps[x.snaps.length-1] = s; else x.snaps.push(s);
      if(x.snaps.length > 400) x.snaps.splice(1, x.snaps.length-400);
      x.title = v.title;
    }
    save(); toast("최신 수치를 기록했습니다.");
  }catch(e){ toast(e.message, true); }
  CV.busy = false; render();
}

async function fetchComments(vids){
  const out = [];
  await pool(vids, 3, async v => {
    try{
      const j = await yt("commentThreads", {part:"snippet", videoId:v.id, maxResults:40, order:"relevance", textFormat:"plainText"}, 1);
      for(const it of j.items||[]){ const s = it.snippet?.topLevelComment?.snippet; if(s?.textDisplay) out.push({t:s.textDisplay.replace(/\s+/g," ").slice(0,160), likes:+s.likeCount||0, vid:v.id}); }
    }catch(e){ if(/할당량|키/.test(e.message)) throw e; /* 댓글 사용 중지 영상은 건너뜀 */ }
  });
  return out;
}
class ClaudeErr extends Error{}
async function claude(prompt, maxTokens=1800){
  if(!S.claudeKey) throw new ClaudeErr("Claude API 키가 없습니다. 설정에서 입력해 주세요.");
  let r;
  try{
    r = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", headers:{
      "content-type":"application/json", "x-api-key":S.claudeKey, "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true", ...(S.claudeWs?{"anthropic-workspace-id":S.claudeWs}:{})},
      body: JSON.stringify({model:S.settings.model, max_tokens:maxTokens, messages:[{role:"user", content:prompt}]})});
  }catch(e){ throw new ClaudeErr("Claude API에 연결하지 못했습니다."); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401) throw new ClaudeErr("Claude API 키가 올바르지 않습니다. 설정에서 확인해 주세요.");
    if(r.status===429) throw new ClaudeErr("Claude API 요청이 많아 잠시 막혔습니다. 1분 뒤 다시 시도해 주세요.");
    if(r.status===400 && /workspace/i.test(j?.error?.message||"")) throw new ClaudeErr("이 키는 워크스페이스 지정이 필요합니다. 키를 만들 때 워크스페이스를 고르거나, 설정에 워크스페이스 ID(wrkspc_로 시작)를 넣어 주세요.");
    if(r.status===400 && /credit|balance|billing/i.test(j?.error?.message||"")) throw new ClaudeErr("Claude API 크레딧이 부족합니다. Claude Console의 결제 메뉴에서 충전해 주세요.");
    if(r.status===404) throw new ClaudeErr(`모델 이름(${S.settings.model})을 찾지 못했습니다. 설정에서 모델 이름을 확인해 주세요.`);
    throw new ClaudeErr("Claude API 오류: "+(j?.error?.message||r.status));
  }
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}
function parseJson(txt){
  const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
  if(a<0 || b<=a) throw new ClaudeErr("AI 응답을 읽지 못했습니다. 다시 시도해 주세요.");
  return JSON.parse(txt.slice(a, b+1));
}
function normPct(o){
  if(!o) return o;
  const ent = Object.entries(o).map(([k,v])=>[k, Math.max(0, +v||0)]);
  const s = ent.reduce((a,[,v])=>a+v,0) || 1;
  const r = Object.fromEntries(ent.map(([k,v])=>[k, Math.round(v/s*100)]));
  return r;
}

async function runEstimate(id){
  const c = S.ch[id]; if(!c || DV.est) return;
  DV.est = true; renderDrawer();
  try{
    if(!c.vids?.length) await enrich([id], {depth:30, force:true});
    const cc = S.ch[id];
    const pick = [...cc.vids].filter(v=>v.comments>0).sort((a,b)=>new Date(b.pub)-new Date(a.pub)).slice(0,6);
    const comments = await fetchComments(pick);
    const langs = {}; let n = 0;
    for(const x of comments){ const l = langOf(x.t); if(l){ langs[l]=(langs[l]||0)+1; n++; } }
    cc.aud = {at:Date.now(), n:comments.length, counted:n, langs};
    save(); renderDrawer();
    if(S.claudeKey){
      const out = parseJson(await claude(estimatePrompt(cc, comments)));
      out.gender = normPct(out.gender); out.age = normPct(out.age); out.at = Date.now();
      cc.ai = out; save();
      toast("시청자 추정과 AI 요약을 마쳤습니다.");
    } else {
      toast("댓글 언어 분포만 계산했습니다. 성별·연령 추정은 설정에 Claude API 키를 넣으면 됩니다.");
    }
  }catch(e){ toast(e.message, true); }
  DV.est = false; if(DV.id===id) renderDrawer(); if(route()==="compare") render();
}

function chart(c){
  const vids = [...(c.vids||[])].reverse(); // 오래된 것 → 최신
  if(!vids.length) return '<div class="muted">최근 영상이 없습니다.</div>';
  const W=760, H=220, L=52, R=12, T=12, B=28;
  const mx = Math.max(...vids.map(v=>v.views), 1);
  const step = niceStep(mx/4), top = Math.ceil(mx/step)*step;
  const y = v => T + (H-T-B)*(1 - v/top);
  const bw = (W-L-R)/vids.length;
  let g = "";
  for(let t=0; t<=top+1; t+=step){ g += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" class="num">${fmtN(t)}</text>`; }
  const bars = vids.map((v,i)=>{ const x=L+i*bw+bw*.15, h=Math.max(1,(H-T-B)-(y(v.views)-T)); return `<rect x="${x.toFixed(1)}" y="${y(v.views).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${v.dur<=SHORT_MAX?'var(--short)':'var(--accent)'}"><title>${esc(v.title)} · ${fmtFull(v.views)}회 · ${fmtDate(v.pub)}</title></rect>`; }).join("");
  const md = c.m?.med||0;
  const medLine = md ? `<line x1="${L}" x2="${W-R}" y1="${y(md)}" y2="${y(md)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-R}" y="${y(md)-5}" text-anchor="end" font-size="11" fill="var(--ink)">중앙값 ${fmtN(md)}</text>` : "";
  const xl = `<text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${fmtDate(vids[0].pub)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtDate(vids[vids.length-1].pub)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 영상 조회수">${g}${bars}${medLine}${xl}</svg>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(x,1)))); const n = x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

const VIEWS = { search:viewSearch, lists:viewLists, compare:viewCompare, monitor:viewMonitor, campaign:viewCampaign, setup:viewSetup };

function render(){
  const r = route();
  const ae = document.activeElement, focusId = ae?.id, sel = (ae && "selectionStart" in ae) ? [ae.selectionStart, ae.selectionEnd] : null;
  $("#main").innerHTML = VIEWS[r]();
  for(const a of document.querySelectorAll("#nav a")){ if(a.getAttribute("href")==="#"+r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); }

function toggleCompare(id){
  const i = S.compare.indexOf(id);
  if(i>=0) S.compare.splice(i,1);
  else { if(S.compare.length>=6){ toast("비교는 최대 6개까지입니다."); return false; } S.compare.push(id); }
  save(); return true;
}
function toggleStar(id){
  const l = S.lists[S.activeList]; const i = l.ids.indexOf(id);
  if(i>=0) l.ids.splice(i,1); else l.ids.push(id);
  save();
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if(el.tagName==="INPUT" && el.type==="checkbox"){ if(a==="cmp"){ if(!toggleCompare(id)) el.checked=false; renderCounts(); } return; }
  switch(a){
    case "detail": openDetail(id); break;
    case "close": closeDetail(); break;
    case "star": toggleStar(id); DV.id ? renderDrawer() : 0; render(); break;
    case "cmp": toggleCompare(id); if(DV.id) renderDrawer(); render(); break;
    case "track": try{ await track(id); toast("모니터링에 추가했습니다. '모니터링' 탭에서 업데이트를 확인하세요."); }catch(err){ toast(err.message,true);} if(DV.id) renderDrawer(); render(); break;
    case "untrack": delete S.tracked[id]; save(); if(DV.id) renderDrawer(); render(); break;
    case "refreshOne": DV.loading=true; renderDrawer(); try{ await enrich([id],{depth:30, force:true}); }catch(err){toast(err.message,true);} DV.loading=false; renderDrawer(); render(); break;
    case "sort": { const st = el.dataset.scope==="search" ? SV.sort : LV.sort; if(st.k===el.dataset.k) st.d*=-1; else { st.k=el.dataset.k; st.d=1; } render(); break; }
    case "mode": SV.mode = el.dataset.v; render(); break;
    case "ex": $("#q").value = el.dataset.v; runSearch(); break;
    case "direct": { const v=$("#direct").value; if(!v.trim()) return; try{ const cid = await resolveChannel(v); cid ? openDetail(cid) : toast("채널을 찾지 못했습니다.", true); }catch(err){ toast(err.message,true);} break; }
    case "subPreset": SV.f.subMin = el.dataset.a; SV.f.subMax = el.dataset.b; render(); break;
    case "topic": { const t=el.dataset.v, i=SV.f.topics.indexOf(t); i>=0?SV.f.topics.splice(i,1):SV.f.topics.push(t); render(); break; }
    case "resetF": SV.f = {subMin:"",subMax:"",medMin:"",rateMin:"",engMin:"",recent:"0",kr:false,topics:[],format:"all",ad:"all"}; render(); break;
    case "estimate": runEstimate(id); break;
    case "testClaude": { const k=$("#claudeKeyIn").value.trim(), md=$("#s-model").value.trim(); const pk=S.claudeKey, pm=S.settings.model, pw=S.claudeWs; S.claudeKey=k; S.claudeWs=$("#claudeWsIn").value.trim(); S.settings.model=md||pm; try{ await claude('"ok"라고만 답해.', 10); toast("Claude API 연결에 성공했습니다. 저장을 눌러 주세요."); }catch(err){ toast(err.message,true); } S.claudeKey=pk; S.claudeWs=pw; S.settings.model=pm; break; }
    case "showClaudeKey": { const i=$("#claudeKeyIn"); i.type = i.type==="password"?"text":"password"; el.textContent = i.type==="password"?"보기":"숨기기"; break; }
    case "saveAll": { const l=S.lists[S.activeList]; const rows=SV.ids.map(i=>S.ch[i]).filter(Boolean).filter(passes); let n=0; for(const c of rows) if(!l.ids.includes(c.id)){ l.ids.push(c.id); n++; } save(); toast(`'${l.name}'에 ${n}개 채널을 저장했습니다.`); render(); break; }
    case "exportSearch": exportChannels(sortRows(SV.ids.map(i=>S.ch[i]).filter(Boolean).filter(passes), SV.sort), `채널검색_${SV.q}`); break;
    case "pickList": S.activeList = id; LV.confirm=null; LV.renaming=false; save(); render(); break;
    case "newList": { const k=uid(); S.lists[k]={name:`새 리스트 ${Object.keys(S.lists).length+1}`, ids:[]}; S.activeList=k; LV.renaming=true; save(); render(); $("#renameIn")?.select(); break; }
    case "rename": LV.renaming=true; render(); $("#renameIn")?.select(); break;
    case "renameOk": { const v=$("#renameIn").value.trim(); if(v) S.lists[S.activeList].name=v; LV.renaming=false; save(); render(); break; }
    case "delList": LV.confirm="list"; render(); break;
    case "delListOk": delete S.lists[S.activeList]; S.activeList=Object.keys(S.lists)[0]; LV.confirm=null; save(); render(); break;
    case "cancel": LV.confirm=null; CV.confirm=null; SETUP.confirm=null; render(); break;
    case "removeFromList": { const l=S.lists[S.activeList]; l.ids=l.ids.filter(x=>x!==id); save(); render(); break; }
    case "listToCompare": S.compare=[...new Set([...S.compare, ...S.lists[S.activeList].ids])].slice(0,6); save(); location.hash="compare"; break;
    case "listToMonitor": { try{ for(const i of S.lists[S.activeList].ids) await track(i); toast("리스트 채널을 모두 모니터링에 추가했습니다."); }catch(err){toast(err.message,true);} render(); break; }
    case "refreshList": { LV.loading=true; render(); try{ await enrich(S.lists[S.activeList].ids,{force:true}); toast("데이터를 새로 불러왔습니다."); }catch(err){toast(err.message,true);} LV.loading=false; render(); break; }
    case "exportList": exportChannels(S.lists[S.activeList].ids.map(i=>S.ch[i]).filter(Boolean), `후보리스트_${S.lists[S.activeList].name}`); break;
    case "clearCmp": S.compare=[]; save(); render(); break;
    case "checkMon": checkMonitor(); break;
    case "toCamp": { if(!S.campaigns.length){ toast("캠페인 성과 탭에서 캠페인을 먼저 만드세요."); return; } await addCampVideos(el.dataset.vid, camp().id); break; }
    case "snapCamp": snapCampaign(); break;
    case "rmVid": { const c=camp(); c.videos=c.videos.filter(v=>v.id!==el.dataset.vid); save(); render(); break; }
    case "delCamp": CV.confirm="camp"; render(); break;
    case "delCampOk": S.campaigns=S.campaigns.filter(c=>c.id!==S.activeCamp); S.activeCamp=S.campaigns[0]?.id||null; CV.confirm=null; save(); render(); break;
    case "exportCamp": exportCampaign(); break;
    case "showKey": { const i=$("#keyIn"); i.type = i.type==="password"?"text":"password"; el.textContent = i.type==="password"?"보기":"숨기기"; break; }
    case "testKey": { const k=$("#keyIn").value.trim(); const prev=S.key; S.key=k; try{ await yt("channels",{part:"id",id:"UC_x5XG1OV2P6uZZ5FSM9Ttw"},1); toast("연결에 성공했습니다. 저장을 눌러 주세요."); }catch(err){ toast(err.message,true); } S.key=prev; break; }
    case "exportJson": { const {key, claudeKey, claudeWs, ch, quota, ...rest} = S; download(`epicscout_backup_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(rest,null,1), "application/json"); break; }
    case "clearCache": SETUP.confirm="cache"; render(); break;
    case "clearCacheOk": S.ch={}; SETUP.confirm=null; save(); toast("분석 캐시를 비웠습니다."); render(); break;
  }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && DV.id) closeDetail();
  if(e.key==="Enter" && e.target.matches?.('[data-act="detail"]')) openDetail(e.target.dataset.id);
  if(e.key==="Enter" && e.target.id==="direct"){ e.preventDefault(); document.querySelector('[data-act="direct"]').click(); }
  if(e.key==="Enter" && e.target.id==="renameIn"){ e.preventDefault(); document.querySelector('[data-act="renameOk"]').click(); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target.id;
  if(f==="searchForm") runSearch();
  if(f==="cmpForm"){ const v=$("#cmpIn").value; if(!v.trim()) return; try{ const id=await resolveChannel(v); if(!id) return toast("채널을 찾지 못했습니다.",true); if(!S.compare.includes(id)) toggleCompare(id); render(); }catch(err){toast(err.message,true);} }
  if(f==="monForm"){ const v=$("#monIn").value; if(!v.trim()) return; try{ const id=await resolveChannel(v); if(!id) return toast("채널을 찾지 못했습니다.",true); await track(id); render(); toast("추가했습니다. '업데이트 확인'을 누르세요."); }catch(err){toast(err.message,true);} }
  if(f==="newCampForm"){ const v=$("#newCampIn").value.trim(); if(!v) return; const c={id:uid(), name:v, created:Date.now(), videos:[]}; S.campaigns.push(c); S.activeCamp=c.id; save(); render(); }
  if(f==="addVidForm"){ const t=$("#vidIn").value; await addCampVideos(t, camp().id); }
  if(f==="claudeForm"){ S.claudeKey=$("#claudeKeyIn").value.trim(); S.claudeWs=$("#claudeWsIn").value.trim(); S.settings.model=$("#s-model").value.trim()||DEF.settings.model; save(); toast(S.claudeKey?"Claude API 키를 저장했습니다.":"Claude API 키를 지웠습니다."); render(); }
  if(f==="keyForm"){ S.key=$("#keyIn").value.trim(); save(); toast(S.key?"API 키를 저장했습니다.":"API 키를 지웠습니다."); render(); }
  if(f==="setForm"){
    const n = id => Math.max(0, +$(id).value||0);
    S.settings.depth = +$("#s-depth").value; S.settings.region = $("#s-region").value;
    S.settings.cpvLong = [n("#s-l0"), n("#s-l1")].sort((a,b)=>a-b);
    S.settings.cpvShort = [n("#s-s0"), n("#s-s1")].sort((a,b)=>a-b);
    S.settings.rpmLong = [n("#s-r0"), n("#s-r1")].sort((a,b)=>a-b);
    S.settings.rpmShort = [n("#s-r2"), n("#s-r3")].sort((a,b)=>a-b);
    save(); toast("분석 기준을 저장했습니다."); render();
  }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  const map = {"f-subMin":"subMin","f-subMax":"subMax","f-medMin":"medMin","f-rateMin":"rateMin","f-engMin":"engMin","f-recent":"recent","f-format":"format","f-ad":"ad"};
  if(map[id]){ SV.f[map[id]] = e.target.value; render(); }
  if(id==="f-kr"){ SV.f.kr = e.target.value==="1"; render(); }
  if(id==="activeList"){ S.activeList = e.target.value; save(); render(); }
  if(id==="pages"){ SV.pages = +e.target.value; render(); }
  if(id==="monDays"){ MV.days = e.target.value; render(); }
  if(id==="campSel"){ S.activeCamp = e.target.value; save(); render(); }
  if(id==="importIn"){
    const file = e.target.files[0]; if(!file) return;
    file.text().then(t=>{
      const o = JSON.parse(t);
      for(const k of ["settings","lists","activeList","compare","tracked","campaigns","activeCamp"]) if(o[k]!==undefined) S[k]=o[k];
      if(!S.lists[S.activeList]) S.activeList = Object.keys(S.lists)[0];
      save(); toast("백업을 불러왔습니다."); render();
    }).catch(()=>toast("백업 파일을 읽지 못했습니다. Epic Scout에서 저장한 JSON인지 확인해 주세요.", true));
  }
});

/* ============ 내보내기 ============ */
function exportChannels(rows, name){
  const head = ["채널명","채널ID","핸들","URL","국가","카테고리","구독자","누적조회수","영상수","분석영상수","조회수중앙값","조회수평균","구독자대비조회(%)","참여율(%)","롱폼수","숏폼수","롱폼중앙값","숏폼중앙값","업로드주기(일)","최근업로드","예상단가하단(원)","예상단가상단(원)","광고영상수","광고영상조회_일반대비(%)","예상월수익하단(원)","예상월수익상단(원)","추정여성비율(%)","추정주연령대","적합업종"];
  const data = rows.map(c=>{ const m=c.m||{}, p=price(c), rv=revenue(c); return [c.title,c.id,c.handle,`https://www.youtube.com/channel/${c.id}`,c.country,(c.topics||[]).join("/"),c.hidden?"비공개":c.subs,c.views,c.videoCount,m.n||0,Math.round(m.med||0),Math.round(m.avg||0),m.rate!=null?(m.rate*100).toFixed(1):"",m.eng!=null?(m.eng*100).toFixed(2):"",m.longN||0,m.shortN||0,Math.round(m.longMed||0),Math.round(m.shortMed||0),m.every!=null?m.every.toFixed(1):"",m.last?fmtDate(m.last):"",p?Math.round(p.lo):"",p?Math.round(p.hi):"",m.adN??"",m.adLift!=null?(m.adLift*100).toFixed(0):"",rv?Math.round(rv.lo):"",rv?Math.round(rv.hi):"",c.ai?.gender?.female??"",topAge(c)||"",(c.ai?.fitIndustries||[]).join("/")]; });
  download(`${name.replace(/[\\/:*?"<>|]/g,"_")}_${new Date().toISOString().slice(0,10)}.csv`, csv([head, ...data]), "text/csv;charset=utf-8");
}
function exportCampaign(){
  const c = camp(); if(!c) return;
  const now = Date.now();
  const head = ["영상제목","영상URL","채널","게시일","길이(초)","조회수","좋아요","댓글","참여율(%)","24시간증가","수집횟수","마지막수집"];
  const data = c.videos.map(v=>{ const s=last(v), p=snapAt(v,now-DAY); return [v.title,`https://www.youtube.com/watch?v=${v.id}`,v.chTitle,fmtDate(v.pub),v.dur,s.v,s.l,s.c,s.v?((s.l+s.c)/s.v*100).toFixed(2):"",s.v-p.v,v.snaps.length,new Date(s.t).toLocaleString("ko-KR")]; });
  download(`캠페인성과_${c.name.replace(/[\\/:*?"<>|]/g,"_")}_${new Date().toISOString().slice(0,10)}.csv`, csv([head, ...data]), "text/csv;charset=utf-8");
}

render();
</script>
